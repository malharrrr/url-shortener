<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protected link — snip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    :root {
      --sand-50:  #faf8f4;
      --sand-100: #f3efe6;
      --sand-200: #e8e0d0;
      --sand-300: #d4c9b4;
      --clay:     #8b6f52;
      --clay-dk:  #6b5040;
      --rust:     #c0533a;
      --ink:      #2a2118;
      --ink-60:   #6b5f52;
      --ink-40:   #9c8f84;
    }
    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--sand-50);
      color: var(--ink);
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--sand-200);
      border-radius: 16px;
      padding: 40px 36px;
      width: min(400px, 100%);
      box-shadow: 0 4px 24px rgba(42,33,24,.08), 0 1px 4px rgba(42,33,24,.04);
    }
    .lock-wrap {
      width: 48px; height: 48px;
      background: var(--sand-100);
      border: 1px solid var(--sand-200);
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 22px; margin-bottom: 20px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 22px; font-weight: 700;
      letter-spacing: -.02em; margin-bottom: 6px;
    }
    .subtitle { font-size: 14px; color: var(--ink-60); line-height: 1.5; margin-bottom: 28px; }
    label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 10px; text-transform: uppercase;
      letter-spacing: .1em; color: var(--ink-40); margin-bottom: 7px;
    }
    input[type="password"] {
      width: 100%; padding: 11px 14px;
      background: var(--sand-50);
      border: 1px solid var(--sand-300);
      border-radius: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 14px; color: var(--ink);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input[type="password"]:focus { border-color: var(--clay); box-shadow: 0 0 0 3px rgba(139,111,82,.12); }
    input.has-error { border-color: var(--rust); box-shadow: 0 0 0 3px rgba(192,83,58,.1); }
    .error-msg { font-size: 12px; color: var(--rust); margin-top: 7px; display: none; }
    .error-msg.visible { display: block; }
    button[type="submit"] {
      width: 100%; margin-top: 20px; padding: 11px;
      background: var(--clay); border: none; border-radius: 6px;
      color: #fff; font-family: 'Lora', Georgia, serif;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background .15s, transform .12s;
      box-shadow: 0 1px 3px rgba(139,111,82,.3);
    }
    button[type="submit"]:hover { background: var(--clay-dk); transform: translateY(-1px); }
    .back { display: block; text-align: center; margin-top: 16px; font-size: 12px; color: var(--ink-40); text-decoration: none; }
    .back:hover { color: var(--clay); }
    .brand { text-align: center; margin-top: 28px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--sand-300); letter-spacing: .06em; }
  </style>
</head>
<body>
<div class="card">
  <div class="lock-wrap">🔒</div>
  <h1>Protected link</h1>
  <p class="subtitle">This destination is password protected.<br>Enter the passphrase to continue.</p>

  <form method="POST" action="/__SLUG__">
    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autofocus autocomplete="current-password"
           placeholder="Enter passphrase" required>
    <p class="error-msg" id="errMsg">Incorrect password. Please try again.</p>
    <button type="submit">Continue →</button>
  </form>

  <a href="/" class="back">← Back to snip</a>
  <div class="brand">snip · edge-powered links</div>
</div>
<script>
  if ('__ERROR__' === 'true') {
    document.getElementById('password').classList.add('has-error');
    document.getElementById('errMsg').classList.add('visible');
  }
</script>
</body>
</html>
